# =============================================================================
# Nginx Configuration for Music Generation Services
# API Gateway routing all traffic through single domain
# =============================================================================

# Upstream definitions
upstream ace_step_ui {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream ace_step_backend {
    server 127.0.0.1:8001;
    keepalive 16;
}

upstream wan22_backend {
    server 127.0.0.1:8080;
    keepalive 16;
}

# HTTP Server - Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name suno.enowsinke.com _;
    
    # Redirect all HTTP traffic to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS Server - Main Application
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name suno.enowsinke.com;
    
    # SSL configuration (managed by certbot)
    ssl_certificate /etc/letsencrypt/live/suno.enowsinke.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/suno.enowsinke.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    
    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/x-javascript;
    
    # Logging
    access_log /var/log/nginx/music-access.log;
    error_log /var/log/nginx/music-error.log;
    
    # Root for static files (UI is served via proxy)
    root /var/www/html;
    
    # ========================================
    # Frontend: ACE-Step UI (React App)
    # ========================================
    location / {
        proxy_pass http://ace_step_ui;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        
        # For long-polling WebSocket connections
        proxy_buffering off;
        proxy_cache off;
    }
    
    # ========================================
    # API Gateway: ACE-Step 1.5 Backend
    # ========================================
    location /api/ace-step/ {
        # Rewrite to remove /api/ace-step prefix
        rewrite ^/api/ace-step/(.*) /$1 break;
        
        proxy_pass http://ace_step_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Path /api/ace-step/;
        
        # Long timeout for generation tasks
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 300s;
        
        # Disable buffering for streaming responses
        proxy_buffering off;
        proxy_request_buffering off;
        
        # Max upload size for audio files
        client_max_body_size 100M;
    }
    
    # ACE-Step WebSocket support
    location /api/ace-step/ws {
        rewrite ^/api/ace-step/(.*) /$1 break;
        
        proxy_pass http://ace_step_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }
    
    # ========================================
    # API Gateway: Wan2.2 Video Generation
    # ========================================
    location /api/wan22/ {
        rewrite ^/api/wan22/(.*) /$1 break;
        
        proxy_pass http://wan22_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Very long timeout for video generation
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
        proxy_connect_timeout 300s;
        
        # Disable buffering for large file uploads/downloads
        proxy_buffering off;
        proxy_request_buffering off;
        
        # Max upload size for video/image files
        client_max_body_size 500M;
    }
    
    # ========================================
    # Health Checks
    # ========================================
    location /health {
        proxy_pass http://ace_step_backend/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }
    
    location /api/health {
        return 200 '{"status":"healthy","service":"nginx-gateway"}';
        add_header Content-Type application/json;
        access_log off;
    }
    
    # ========================================
    # Static Assets (if needed)
    # ========================================
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # ========================================
    # Deny access to hidden files
    # ========================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# Development/Port Access (optional - for direct access without domain)
server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;
    
    # Redirect to main domain
    return 301 https://suno.enowsinke.com$request_uri;
}